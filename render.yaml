# Optional blueprint for Render.com - hosts the Flask backend that Cloudflare Pages forwards to.
services:
  - type: web
    name: astra-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements-server.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 16 --timeout 120
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ASTRA_HOSTED
        value: "1"
      - key: ASTRA_BEHIND_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false        # paste your PostgreSQL connection string (e.g. from Neon)
