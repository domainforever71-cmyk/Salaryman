name: Build Astra Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-server.txt pyinstaller

      - name: Build executable
        run: Build_EXE.bat
        shell: cmd
        env:
          CI: "true"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: astra-windows
          path: astra.exe
          if-no-files-found: error
          retention-days: 14
